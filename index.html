<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-6P289ZhbX0aan59NvzvKrEcq2vrhDUOrYhDYEs0MiMg='; script-src-attr 'none'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יוצאים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>יוצאים</title>
<link rel="apple-touch-icon" id="touch" href="">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f5f2; --ink:#1b1c1e; --mute:#9a9a96; --line:#e7e5e0; --done:#b4b3ae;
  --green:#2f9e63; --btn:#1b1c1e; --btnink:#f6f5f2; --sheet:#ffffff; --scrim:rgba(20,20,20,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --ink:#ececea; --mute:#77777a; --line:#232427; --done:#5a5b5f;
    --green:#4cc283; --btn:#ececea; --btnink:#111214; --sheet:#1a1b1e; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --ink:#ececea; --mute:#77777a; --line:#232427; --done:#5a5b5f;
  --green:#4cc283; --btn:#ececea; --btnink:#111214; --sheet:#1a1b1e; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Heebo","Assistant",-apple-system,"SF Pro Text","Segoe UI",Roboto,"Arial Hebrew",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{padding:28px 28px 8px;display:flex;align-items:flex-start;justify-content:space-between}
h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;transition:opacity .22s ease,color .4s ease}
h1.ready{color:var(--green)}
.sub{margin-top:6px;font-size:15px;color:var(--mute);transition:opacity .3s}
#edit{
  border:0;background:none;color:var(--mute);font:inherit;font-size:15px;
  padding:10px 4px 10px 10px;margin-top:2px;cursor:pointer;transition:color .2s,transform .15s;
}
#edit:active{color:var(--ink);transform:scale(.94)}
#tabs{display:flex;gap:6px;padding:10px 24px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:none;color:var(--mute);font:inherit;font-size:15px;font-weight:500;
  padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:background .25s,color .25s;
}
.tab.on{background:var(--line);color:var(--ink)}
main{flex:1;overflow-y:auto;padding:12px 16px 12px;-webkit-overflow-scrolling:touch}
.row{
  width:100%;display:flex;align-items:center;gap:18px;border:0;background:none;color:inherit;font:inherit;
  text-align:right;padding:0 12px;min-height:68px;border-radius:18px;cursor:pointer;
  transition:background .25s ease,transform .18s cubic-bezier(.2,.8,.2,1);
}
.row+.row{box-shadow:0 -1px 0 var(--line)}
.row:active{transform:scale(.975);background:var(--line)}
.box{
  flex:none;width:30px;height:30px;border-radius:50%;border:1.8px solid var(--mute);
  display:grid;place-items:center;position:relative;
  transition:background .24s ease,border-color .24s ease,transform .28s cubic-bezier(.3,1.6,.5,1);
}
.box svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s ease .04s}
.label{
  font-size:22px;font-weight:500;line-height:1.3;padding:2px 0;
  background:linear-gradient(currentColor,currentColor) no-repeat right 55% / 0% 2px;
  transition:background-size .28s cubic-bezier(.6,0,.2,1),color .28s ease;
}
.row.done .box{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.row.done .box svg{stroke-dashoffset:0}
.row.done .label{color:var(--done);background-size:100% 2px}
.empty{text-align:center;color:var(--mute);padding:90px 30px;font-size:17px;line-height:1.7}
.empty button{margin-top:18px}
footer{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.reset{
  width:100%;height:58px;border:0;border-radius:18px;background:var(--btn);color:var(--btnink);
  font:inherit;font-size:18px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .25s;
}
.reset:active{transform:scale(.97);opacity:.88}
.reset:disabled{opacity:.28;pointer-events:none}
.ghost{border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;padding:12px 22px;border-radius:14px;cursor:pointer}
/* edit sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:82%;background:var(--sheet);
  border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .42s cubic-bezier(.22,.9,.25,1);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
}
body.open #scrim{opacity:1;pointer-events:auto}
body.open #sheet{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.sh b{font-size:19px;font-weight:600}
.sh button{border:0;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:8px 4px;cursor:pointer}
#sbody{position:relative;flex:1;overflow-y:auto;padding:4px 22px 20px}
.lists{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.name{width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:17px;padding:10px 2px;outline:none;border-radius:0}
.name:focus{border-color:var(--ink)}
.item{display:flex;align-items:center;gap:8px;padding:2px 0;box-shadow:0 1px 0 var(--line)}
.item.dragging{position:absolute;z-index:20;background:var(--sheet);border-radius:15px;scale:1.035;box-shadow:0 16px 36px rgba(0,0,0,.20),0 3px 8px rgba(0,0,0,.10);will-change:transform;pointer-events:auto}
.item-slot{border-radius:14px;background:var(--line);opacity:.5;box-sizing:border-box}
.item.pressing{background:var(--line);border-radius:12px;scale:.985;transition:scale .18s,background .18s}
.item{transition:box-shadow .22s,background .22s;border-radius:12px}
.row.done .box{animation:check-pop .34s cubic-bezier(.2,.8,.2,1)}
@keyframes check-pop{0%{transform:scale(1)}45%{transform:scale(1.25)}75%{transform:scale(1.02)}100%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important}}
.reorder{flex:none;border:0;background:none;color:var(--mute);font-size:24px;width:36px;height:48px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.reorder:active{cursor:grabbing;color:var(--ink)}
.reorder-hint{color:var(--mute);font-size:13px;margin:0 0 8px}
body.reordering,body.reordering *{user-select:none!important;-webkit-user-select:none!important;cursor:grabbing!important}
.item input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:18px;padding:14px 2px;outline:none;min-width:0}
.x{border:0;background:none;color:var(--mute);width:44px;height:44px;font-size:22px;cursor:pointer;border-radius:12px;transition:color .2s,background .2s}
.x:active{color:#d4483b;background:var(--line)}
.add{display:flex;gap:10px;margin:14px 0 22px}
.add input{flex:1;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;outline:none}
.add input:focus{border-color:var(--ink)}
.add button{border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font:inherit;font-size:16px;font-weight:600;padding:0 20px;cursor:pointer}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.danger{color:#d4483b;border-color:transparent}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

/* A final, deliberate check before starting a fresh trip. */
.reset{width:auto;height:auto;min-height:40px;padding:8px 16px;border-radius:12px;background:none;color:var(--mute);font-size:14px;font-weight:400}
footer{text-align:center;padding-top:2px}
#completion[hidden]{display:none!important}
#completion{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;isolation:isolate;background:rgba(18,24,21,.38);animation:veil-in .22s ease both;contain:layout style}
#completion::before{content:"";position:absolute;inset:0;background:var(--bg);opacity:0;z-index:-1;transition:opacity .3s}
.completion-bubble{position:relative;width:min(86vw,360px);aspect-ratio:1;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;isolation:isolate;will-change:transform,opacity;animation:bubble-in .52s cubic-bezier(.2,1.25,.3,1) both}
.completion-bubble::before{content:"";position:absolute;inset:0;border-radius:50%;z-index:-1;background:#e1f5eb;border:1px solid rgba(255,255,255,.7);box-shadow:0 16px 38px rgba(0,0,0,.12)}

.bag-orbit{width:68px;height:68px;margin:0 0 10px;display:grid;place-items:center;position:relative}
.bag-icon{font-size:48px;line-height:1;display:block;animation:bag-float 3.8s ease-in-out infinite;will-change:transform}




.completion-kicker{font-size:14px;color:#52756c;margin:0 0 7px}
.completion-bubble h2{font-size:clamp(24px,6.6vw,29px);line-height:1.25;letter-spacing:-.03em;margin:0 0 18px;font-weight:650;color:#183e34;max-width:210px;text-wrap:balance}
#packedYes{border:1px solid rgba(255,255,255,.5);background:#247c59;color:white;border-radius:999px;min-width:128px;min-height:52px;padding:12px 25px;font:inherit;font-size:21px;font-weight:600;cursor:pointer;transition:transform .12s;box-shadow:0 5px 12px rgba(36,124,89,.14)}
#packedYes:active{transform:scale(.91)}
#packedYes:focus-visible{outline:3px solid #247c59;outline-offset:5px}

#completion.popped .completion-bubble{pointer-events:none;animation:bubble-pop .3s cubic-bezier(.2,.7,.2,1) both}
#completion.popped .bag-icon{animation-play-state:paused}
.completion-success{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;visibility:hidden;opacity:0;text-align:center;pointer-events:none}
.completion-success .success-check{width:100px;height:100px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:white;font-size:58px;box-shadow:0 10px 28px rgba(47,158,99,.16)}
.completion-success h2{font-size:30px;margin:0;color:var(--ink)}
#completion.celebrated::before{opacity:1}
#completion.celebrated .completion-success{visibility:visible;opacity:1;animation:success-in .45s cubic-bezier(.16,1.3,.3,1) both}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;contain:strict}
.confetti-piece{position:absolute;top:50%;left:50%;width:8px;height:12px;border-radius:50%;opacity:0}
.confetti-piece:nth-child(3n){height:8px;background:transparent!important;border:2px solid #70bfa2}
#completion.popped .confetti-piece{animation:confetti-burst .8s cubic-bezier(.12,.65,.25,1) both}
@keyframes veil-in{from{opacity:0}to{opacity:1}}
@keyframes bubble-in{0%{opacity:0;transform:translateY(32px) scale(.65)}65%{opacity:1;transform:translateY(-4px) scale(1.035)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bag-float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(3deg)}}

@keyframes bubble-pop{0%{opacity:1;transform:scale(1)}30%{opacity:1;transform:scale(.89,1.03)}65%{opacity:1;transform:scale(1.14,.97)}100%{opacity:0;transform:scale(1.24)}}
@keyframes confetti-burst{0%{opacity:0;transform:translate(0,0) scale(.3)}12%{opacity:1}65%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--spin)) scale(.6)}}
@keyframes success-in{from{opacity:0;transform:translateY(12px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
@media (max-height:520px){.completion-bubble{width:min(74vh,320px)}.bag-orbit{height:46px;margin-bottom:4px}.bag-icon{font-size:36px}.completion-bubble h2{font-size:23px;margin-bottom:10px}}
@media (prefers-reduced-motion:reduce){#completion,.completion-bubble,.bag-icon,.completion-success{animation:none!important;transition:none!important}#completion.popped .completion-bubble{opacity:0}}

</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="title">יוצאים</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button id="edit" aria-label="עריכה">עריכה</button>
  </header>
  <div id="tabs"></div>
  <main id="list"></main>
  <footer><button class="reset" id="reset">איפוס הרשימה</button></footer>
</div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-label="עריכה">
  <div class="sh"><b>עריכה</b><button id="done">סיום</button></div>
  <div id="sbody"></div>
</div>
<div id="completion" role="dialog" aria-modal="true" aria-labelledby="packingQuestion" hidden>
  <div class="completion-bubble">
    <div class="bag-orbit" aria-hidden="true"><span class="bag-icon">🎒</span></div>
    <p class="completion-kicker">רגע לפני סיום</p>
    <h2 id="packingQuestion">הכל בתוך התיק?</h2>
    <button id="packedYes">כן! <span aria-hidden="true">✓</span></button>
  </div>
  <div id="confetti" aria-hidden="true"></div>
  <div class="completion-success" role="status" aria-live="polite">
    <span class="success-check" aria-hidden="true">✓</span><h2>מוכנים ליציאה!</h2>
  </div>
</div>
<script>
(function(){
  var KEY="leave-home-v2", S, saveOk=true, appRegistration=null;
  var $=function(i){return document.getElementById(i)};
  function uid(){return Math.random().toString(36).slice(2,9)}
  function load(){
    try{var r=localStorage.getItem(KEY); if(r){var o=JSON.parse(r); if(o&&o.lists&&o.lists.length) return o}}catch(e){}
    var id=uid(), names=["מגבונים","חיתולים","בקבוקים","מים למטרנה","מטרנה","קרקרים","מוצצים","מוצקים","טטרה","בגד החלפה קצר","בגד החלפה ארוך","צעצועים","מפתח לבית"];
    return {lists:[{id:id,name:"תיק אלישע",items:names.map(function(t){return {id:uid(),t:t,d:false}})}],active:id};
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  S=load();
  function cur(){return S.lists.filter(function(l){return l.id===S.active})[0]||S.lists[0]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var lastReady=null;

  function renderTabs(){
    var t=$("tabs");
    if(S.lists.length<2){t.style.display="none";t.innerHTML="";return}
    t.style.display="flex";
    t.innerHTML=S.lists.map(function(l){return '<button class="tab'+(l.id===cur().id?' on':'')+'" data-id="'+l.id+'">'+esc(l.name)+'</button>'}).join("");
  }
  function displayItems(l){
    return l.items.filter(function(it){return !it.d}).concat(
      l.items.filter(function(it){return it.d}).sort(function(a,b){return (a.checkedAt||0)-(b.checkedAt||0)}));
  }
  var pendingMoves={};
  function reducedMotion(){return window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches}
  function motion(el,frames,duration,easing){
    if(!el.animate||reducedMotion())return null;
    return el.animate(frames,{duration:duration,easing:easing||"cubic-bezier(.22,1,.36,1)"});
  }
  function flipRows(rows,change,duration){
    var positions=rows.map(function(r){return r.getBoundingClientRect().top});
    rows.forEach(function(r){if(r._shift){r._shift.cancel();r._shift=null}});
    change();
    var destinations=rows.map(function(r){return r.getBoundingClientRect().top});
    rows.forEach(function(r,i){
      var dy=positions[i]-destinations[i];
      if(Math.abs(dy)>.5){
        if(r._shift)r._shift.cancel();
        r._shift=motion(r,[{transform:"translateY("+dy+"px)"},{transform:"translateY(0)"}],duration||360);
      }
    });
  }
  function cancelMove(id){
    var p=pendingMoves[id];if(!p)return;
    clearTimeout(p.timer);if(p.animation)p.animation.cancel();delete pendingMoves[id];
  }
  function orderRows(){
    var m=$("list"),items=cur().items;
    var ordered=items.filter(function(it){return !it.d||pendingMoves[it.id]}).concat(
      items.filter(function(it){return it.d&&!pendingMoves[it.id]}).sort(function(a,b){return (a.checkedAt||0)-(b.checkedAt||0)}));
    flipRows(Array.from(m.querySelectorAll(".row")),function(){
      var nodes={};Array.from(m.children).forEach(function(row){nodes[row.getAttribute("data-id")]=row});
      ordered.forEach(function(it,i){var row=nodes[it.id];if(row&&m.children[i]!==row)m.insertBefore(row,m.children[i]||null)});
    },280);
  }
  function queueMove(it,el){
    var p=pendingMoves[it.id]={};
    p.timer=setTimeout(function(){
      if(pendingMoves[it.id]!==p||!it.d||!el.isConnected)return;
      p.animation=motion(el,[{opacity:1,transform:"translateY(0) scale(1)"},
        {opacity:0,transform:"translateY(22px) scale(.94)"}],180,"cubic-bezier(.4,0,.6,1)");
      function arrive(){
        if(pendingMoves[it.id]!==p)return;
        delete pendingMoves[it.id];orderRows();
        motion(el,[{opacity:0,translate:"0 -14px",scale:.97},{opacity:1,translate:"0 0",scale:1}],280);
      }
      if(p.animation)p.animation.onfinish=arrive;else arrive();
    },reducedMotion()?0:430);
  }
  function renderList(){
    Object.keys(pendingMoves).forEach(cancelMove);
    var l=cur(), m=$("list");
    if(!l.items.length){
      m.innerHTML='<div class="empty">הרשימה ריקה.<br>הוסיפו את מה שצריך לקחת איתכם.<br><button class="ghost" id="emptyAdd">הוספת פריטים</button></div>';
      $("emptyAdd").onclick=openSheet;
    }else{
      m.innerHTML=displayItems(l).map(function(it){
        return '<button class="row'+(it.d?' done':'')+'" data-id="'+it.id+'"><span class="box">'+CHECK+'</span><span class="label">'+esc(it.t)+'</span></button>';
      }).join("");
    }
    updateHead(true);
  }
  function updateHead(instant){
    var l=cur(), n=l.items.length, d=l.items.filter(function(i){return i.d}).length;
    var ready=n>0&&d===n;
    var h=$("title");
    var want="יוצאים";
    if(h.textContent!==want){
      if(instant){h.textContent=want;h.classList.toggle("ready",ready)}
      else{h.style.opacity=0;setTimeout(function(){h.textContent=want;h.classList.toggle("ready",ready);h.style.opacity=1},200)}
    }
    $("sub").textContent=n?(ready?"הכול מסומן — בדיקה אחרונה לתיק":("נשארו "+(n-d)+" מתוך "+n)):"";
    $("reset").disabled=d===0;
  }
  function toggle(id){
    var l=cur(), it=l.items.filter(function(i){return i.id===id})[0]; if(!it) return;
    cancelMove(id);
    it.d=!it.d; it.checkedAt=it.d?Date.now():0; save();
    var el=$("list").querySelector('[data-id="'+id+'"]'); if(el) el.classList.toggle("done",it.d);
    if(it.d&&el)queueMove(it,el);else orderRows();
    updateHead(false);
    checkComplete();
  }
  var timer=null, completionPhase="idle", completionList=null, completionFocus=null, celebrationTimer=null;
  function allDone(l){return l.items.length>0&&l.items.every(function(i){return i.d})}
  function checkComplete(){
    clearTimeout(timer);
    if(!allDone(cur())||document.body.classList.contains("open"))return;
    if(completionPhase!=="idle")return;
    var id=cur().id;
    timer=setTimeout(function(){
      if(cur().id===id&&allDone(cur())&&completionPhase==="idle"&&!document.body.classList.contains("open"))showCompletion();
    },reducedMotion()?120:1050);
  }
  function sweep(){
    // Older versions stored an automatic-reset timestamp. It no longer resets any checks.
    var changed=false;
    S.lists.forEach(function(l){if(l.doneAt){l.doneAt=0;changed=true}});
    if(changed)save();return false;
  }
  function hideCompletion(){
    clearTimeout(celebrationTimer);completionPhase="idle";completionList=null;
    $("completion").hidden=true;$("completion").className="";
    $("confetti").innerHTML="";$("app").inert=false;
    if(completionFocus&&completionFocus.isConnected)completionFocus.focus({preventScroll:true});
  }
  function showCompletion(){
    completionPhase="confirm";completionList=cur().id;completionFocus=document.activeElement;
    $("completion").className="";$("completion").hidden=false;
    if(!reducedMotion()){
      var fragment=document.createDocumentFragment();
      var colors=["#4cc283","#ffd982","#a6c9ff","#f3a8be","#9be2cf"];
      for(var i=0;i<16;i++){
        var piece=document.createElement("span");piece.className="confetti-piece";
        var angle=Math.PI*2*i/16,distance=90+Math.random()*140;
        piece.style.setProperty("--dx",Math.cos(angle)*distance+"px");
        piece.style.setProperty("--dy",Math.sin(angle)*distance+"px");
        piece.style.setProperty("--spin",(Math.random()*600-300)+"deg");
        piece.style.background=colors[i%colors.length];piece.style.animationDelay=(Math.random()*70)+"ms";
        fragment.appendChild(piece);
      }
      $("confetti").appendChild(fragment);
    }
    $("app").inert=true;$("packedYes").disabled=false;$("packedYes").focus({preventScroll:true});
  }
  function confirmPacked(){
    if(completionPhase!=="confirm"||completionList!==cur().id||!allDone(cur()))return;
    completionPhase="celebrating";$("packedYes").disabled=true;
    $("completion").classList.add("popped");
    celebrationTimer=setTimeout(function(){
      if(completionPhase!=="celebrating")return;
      $("completion").classList.add("celebrated");
      celebrationTimer=setTimeout(function(){
        var id=completionList;hideCompletion();
        if(cur().id===id){resetCurrent();$("list").scrollTop=0;$("edit").focus({preventScroll:true})}
      },1900);
    },reducedMotion()?50:250);
  }
  $("packedYes").onclick=confirmPacked;
  $("completion").addEventListener("keydown",function(e){
    if(e.key==="Escape")e.preventDefault();
    if(e.key==="Tab"){e.preventDefault();if(completionPhase==="confirm")$("packedYes").focus()}
  });
  function resetCurrent(){
    var l=cur(); clearTimeout(timer); if(completionPhase!=="idle")hideCompletion(); l.doneAt=0;
    l.items.forEach(function(i){i.d=false}); save();
    renderList();
  }
  $("list").addEventListener("click",function(e){
    var r=e.target.closest(".row"); if(r) toggle(r.getAttribute("data-id"));
  });
  $("tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab"); if(!b) return;
    S.active=b.getAttribute("data-id"); save(); renderTabs(); renderList(); checkComplete();
  });
  $("reset").onclick=function(){resetCurrent()};

  /* edit sheet */
  function openSheet(){renderSheet();document.body.classList.add("open")}
  function closeSheet(){finishDrag();document.activeElement&&document.activeElement.blur();document.body.classList.remove("open");renderTabs();renderList();checkComplete()}
  $("edit").onclick=openSheet;
  $("done").onclick=closeSheet;
  $("scrim").onclick=closeSheet;

  function renderSheet(focusAdd){
    finishDrag();
    var l=cur(), b=$("sbody");
    var lists=S.lists.map(function(x){return '<button class="tab'+(x.id===l.id?' on':'')+'" data-sw="'+x.id+'">'+esc(x.name)+'</button>'}).join("");
    if(S.lists.length<3) lists+='<button class="tab" id="newList">+ רשימה</button>';
    b.innerHTML=
      '<div class="lists">'+lists+'</div>'+
      '<input class="name" id="lname" value="'+esc(l.name)+'" aria-label="שם הרשימה" maxlength="24">'+
      '<div class="add"><input id="newItem" placeholder="פריט חדש" enterkeyhint="done" maxlength="60"><button id="addBtn">הוספה</button></div>'+
      '<p class="reorder-hint">לשינוי הסדר: לחיצה ארוכה על ≡ וגרירה למיקום הרצוי</p>'+
      l.items.map(function(it){return '<div class="item" data-id="'+it.id+'"><button class="reorder" aria-label="שינוי מיקום: '+esc(it.t)+'" title="לחיצה ארוכה וגרירה; או חצים למעלה ולמטה">≡</button><input value="'+esc(it.t)+'" maxlength="60"><button class="x" aria-label="מחיקה">×</button></div>'}).join("")+
      '<div class="tools" style="margin-top:24px">'+(S.lists.length>1?'<button class="ghost danger" id="delList">מחיקת הרשימה</button>':'')+'</div><p style="color:var(--mute);font-size:13px">גרסה 9 · הכול בתוך התיק</p>';
    if(focusAdd) $("newItem").focus();
  }
  /* Long-press handles keep text editing and normal list scrolling available. */
  var drag=null, suppressDragClick=false;
  function finishDrag(cancel){
    if(!drag)return;
    var d=drag;drag=null;clearTimeout(d.timer);cancelAnimationFrame(d.frame);
    d.row.classList.remove("pressing");document.body.classList.remove("reordering");
    if(d.handle.hasPointerCapture(d.pointer))d.handle.releasePointerCapture(d.pointer);
    if(!d.active)return;
    suppressDragClick=true;setTimeout(function(){suppressDragClick=false},0);
    var visual=d.row.getBoundingClientRect(),b=$("sbody");
    if(d.pop)d.pop.cancel();
    flipRows(Array.from(b.querySelectorAll(".item:not(.dragging)")),function(){
      if(cancel){
        var next=d.originalNext;
        b.insertBefore(d.slot,next&&next.isConnected?next:b.querySelector(".tools"));
      }
      d.row.classList.remove("dragging");d.row.removeAttribute("style");
      d.slot.replaceWith(d.row);
    });
    var final=d.row.getBoundingClientRect();
    motion(d.row,[{transform:"translateY("+(visual.top-final.top)+"px)",scale:1.035,boxShadow:"0 16px 36px rgba(0,0,0,.20)"},
      {transform:"translateY(0)",scale:1,boxShadow:"0 1px 0 var(--line)"}],360);
    if(!cancel){
      var ids=Array.from(b.querySelectorAll(".item")).map(function(r){return r.getAttribute("data-id")});
      var l=cur(),old=l.items;
      l.items=ids.map(function(id){return old.filter(function(it){return it.id===id})[0]});save();
    }
  }
  function placeDrag(){
    if(!drag||!drag.active)return;
    var d=drag,b=$("sbody"),rect=b.getBoundingClientRect();
    if(d.y<rect.top+54)b.scrollTop-=9;
    else if(d.y>rect.bottom-54)b.scrollTop+=9;
    var dy=d.y-d.startY+b.scrollTop-d.startScroll;
    d.row.style.transform="translate3d(0,"+dy+"px,0)";
    var others=Array.from(b.querySelectorAll(".item:not(.dragging)"));
    var contentY=d.y-rect.top+b.scrollTop;
    var before=others.filter(function(r){return contentY<r.offsetTop+r.offsetHeight/2})[0]||b.querySelector(".tools");
    // Ignore the floating row when checking whether the slot has already reached its destination.
    var next=d.slot.nextElementSibling;if(next===d.row)next=next.nextElementSibling;
    if(next!==before)flipRows(others,function(){b.insertBefore(d.slot,before)});
    d.frame=requestAnimationFrame(placeDrag);
  }
  $("sbody").addEventListener("pointerdown",function(e){
    var h=e.target.closest(".reorder");if(!h||e.button!==0||drag)return;
    e.preventDefault();
    var d=drag={handle:h,row:h.closest(".item"),pointer:e.pointerId,x:e.clientX,y:e.clientY,startY:e.clientY,active:false};
    d.row.classList.add("pressing");
    h.setPointerCapture(e.pointerId);
    d.timer=setTimeout(function(){
      if(drag!==d)return;
      document.activeElement&&document.activeElement.blur();d.active=true;
      var b=$("sbody"),r=d.row.getBoundingClientRect(),top=d.row.offsetTop,left=d.row.offsetLeft;
      d.originalNext=d.row.nextElementSibling;d.startScroll=b.scrollTop;
      d.slot=document.createElement("div");d.slot.className="item-slot";d.slot.style.height=d.row.offsetHeight+"px";
      d.slot.setAttribute("aria-hidden","true");b.insertBefore(d.slot,d.row);
      d.row.classList.remove("pressing");d.row.classList.add("dragging");
      d.row.style.top=top+"px";d.row.style.left=left+"px";d.row.style.width=d.row.offsetWidth+"px";
      d.pop=motion(d.row,[{scale:.985},{scale:1.065,offset:.55},{scale:1.035}],300);
      document.body.classList.add("reordering");placeDrag();
    },400);
  });
  $("sbody").addEventListener("pointermove",function(e){
    if(!drag||drag.pointer!==e.pointerId)return;
    if(!drag.active&&(Math.abs(e.clientY-drag.startY)>10||Math.abs(e.clientX-drag.x)>10)){finishDrag(true);return}
    drag.y=e.clientY;if(drag.active)e.preventDefault();
  });
  $("sbody").addEventListener("pointerup",function(e){if(drag&&drag.pointer===e.pointerId)finishDrag()});
  $("sbody").addEventListener("pointercancel",function(){finishDrag(true)});
  $("sbody").addEventListener("lostpointercapture",function(){finishDrag(true)});
  $("sbody").addEventListener("contextmenu",function(e){if(e.target.closest(".reorder"))e.preventDefault()});
  $("sbody").addEventListener("keydown",function(e){
    if(e.key==="Escape"&&drag){finishDrag(true);return}
    var h=e.target.closest(".reorder");if(!h||(e.key!=="ArrowUp"&&e.key!=="ArrowDown"))return;
    e.preventDefault();var l=cur(),id=h.closest(".item").getAttribute("data-id");
    var from=l.items.findIndex(function(it){return it.id===id}),to=from+(e.key==="ArrowUp"?-1:1);
    if(to<0||to>=l.items.length)return;
    l.items.splice(to,0,l.items.splice(from,1)[0]);save();renderSheet();
    $("sbody").querySelector('[data-id="'+id+'"] .reorder').focus();
  });
  function addItem(){
    var inp=$("newItem"), v=inp.value.trim(); if(!v) return;
    cur().items.push({id:uid(),t:v,d:false}); save(); renderSheet(true);
  }
  $("sbody").addEventListener("click",function(e){
    if(suppressDragClick)return;
    var t=e.target, l=cur();
    if(t.id==="addBtn") return addItem();
    var sw=t.getAttribute&&t.getAttribute("data-sw");
    if(sw){S.active=sw;save();return renderSheet()}
    if(t.id==="newList"){var id=uid();S.lists.push({id:id,name:"רשימה "+S.lists.length,items:[]});S.active=id;save();renderSheet();var n=$("lname");n.focus();n.select();return}
    if(t.id==="delList"){
      if(t.getAttribute("data-sure")!=="1"){t.setAttribute("data-sure","1");t.textContent="לחצו שוב למחיקה";return}
      S.lists=S.lists.filter(function(x){return x.id!==l.id});S.active=S.lists[0].id;save();return renderSheet();
    }
    if(t.classList.contains("x")){
      var row=t.closest(".item"), id2=row.getAttribute("data-id");
      l.items=l.items.filter(function(i){return i.id!==id2});save();row.remove();
    }
  });
  $("sbody").addEventListener("input",function(e){
    var t=e.target, l=cur();
    if(t.id==="lname"){l.name=t.value.trim()||"רשימה";save();return}
    var row=t.closest&&t.closest(".item");
    if(row){var it=l.items.filter(function(i){return i.id===row.getAttribute("data-id")})[0]; if(it){it.t=t.value;save()}}
  });
  $("sbody").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="newItem"){e.preventDefault();addItem()}});

  /* home-screen icon */
  try{
    var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");
    x.fillStyle="#111214";x.fillRect(0,0,180,180);
    x.strokeStyle="#4cc283";x.lineWidth=14;x.lineCap="round";x.lineJoin="round";
    x.beginPath();x.moveTo(52,92);x.lineTo(80,120);x.lineTo(130,62);x.stroke();
    $("touch").href=c.toDataURL("image/png");
  }catch(e){}
  if(/^https?:$/.test(location.protocol)){
    $("touch").href="icon-180.png";
    if("serviceWorker" in navigator){
      var hadController=!!navigator.serviceWorker.controller,refreshing=false;
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        if(hadController&&!refreshing){refreshing=true;location.reload()}
      });
      navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){appRegistration=reg;reg.update().catch(function(){})}).catch(function(){});
    }
  }

  sweep();renderTabs();renderList();checkComplete();
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState!=="visible") return;
    if(appRegistration)appRegistration.update().catch(function(){});
    if(sweep()){renderTabs();renderList()}
    checkComplete();
  });
})();
</script>
</body>
</html>
