<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יוצאים">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<title>יוצאים</title>
<link rel="apple-touch-icon" id="touch" href="">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f5f2; --ink:#1b1c1e; --mute:#9a9a96; --line:#e7e5e0; --done:#b4b3ae;
  --green:#2f9e63; --btn:#1b1c1e; --btnink:#f6f5f2; --sheet:#ffffff; --scrim:rgba(20,20,20,.28);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111214; --ink:#ececea; --mute:#77777a; --line:#232427; --done:#5a5b5f;
    --green:#4cc283; --btn:#ececea; --btnink:#111214; --sheet:#1a1b1e; --scrim:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111214; --ink:#ececea; --mute:#77777a; --line:#232427; --done:#5a5b5f;
  --green:#4cc283; --btn:#ececea; --btnink:#111214; --sheet:#1a1b1e; --scrim:rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Heebo","Assistant",-apple-system,"SF Pro Text","Segoe UI",Roboto,"Arial Hebrew",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);
}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header{padding:28px 28px 8px;display:flex;align-items:flex-start;justify-content:space-between}
h1{margin:0;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.15;transition:opacity .22s ease,color .4s ease}
h1.ready{color:var(--green)}
.sub{margin-top:6px;font-size:15px;color:var(--mute);transition:opacity .3s}
#edit{
  border:0;background:none;color:var(--mute);font:inherit;font-size:15px;
  padding:10px 4px 10px 10px;margin-top:2px;cursor:pointer;transition:color .2s,transform .15s;
}
#edit:active{color:var(--ink);transform:scale(.94)}
#tabs{display:flex;gap:6px;padding:10px 24px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:none;color:var(--mute);font:inherit;font-size:15px;font-weight:500;
  padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:background .25s,color .25s;
}
.tab.on{background:var(--line);color:var(--ink)}
main{flex:1;overflow-y:auto;padding:12px 16px 12px;-webkit-overflow-scrolling:touch}
.row{
  width:100%;display:flex;align-items:center;gap:18px;border:0;background:none;color:inherit;font:inherit;
  text-align:right;padding:0 12px;min-height:68px;border-radius:18px;cursor:pointer;
  transition:background .25s ease,transform .18s cubic-bezier(.2,.8,.2,1);
}
.row+.row{box-shadow:0 -1px 0 var(--line)}
.row:active{transform:scale(.975);background:var(--line)}
.box{
  flex:none;width:30px;height:30px;border-radius:50%;border:1.8px solid var(--mute);
  display:grid;place-items:center;position:relative;
  transition:background .3s ease,border-color .3s ease,transform .35s cubic-bezier(.3,1.6,.5,1);
}
.box svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s ease .08s}
.label{
  font-size:22px;font-weight:500;line-height:1.3;padding:2px 0;
  background:linear-gradient(currentColor,currentColor) no-repeat right 55% / 0% 2px;
  transition:background-size .38s cubic-bezier(.6,0,.2,1),color .35s ease;
}
.row.done .box{background:var(--green);border-color:var(--green);transform:scale(1.08)}
.row.done .box svg{stroke-dashoffset:0}
.row.done .label{color:var(--done);background-size:100% 2px}
.empty{text-align:center;color:var(--mute);padding:90px 30px;font-size:17px;line-height:1.7}
.empty button{margin-top:18px}
footer{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px))}
.reset{
  width:100%;height:58px;border:0;border-radius:18px;background:var(--btn);color:var(--btnink);
  font:inherit;font-size:18px;font-weight:600;cursor:pointer;transition:transform .15s,opacity .25s;
}
.reset:active{transform:scale(.97);opacity:.88}
.reset:disabled{opacity:.28;pointer-events:none}
.ghost{border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;padding:12px 22px;border-radius:14px;cursor:pointer}
/* edit sheet */
#scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
#sheet{
  position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;height:82%;background:var(--sheet);
  border-radius:26px 26px 0 0;transform:translateY(102%);transition:transform .42s cubic-bezier(.22,.9,.25,1);
  display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
}
body.open #scrim{opacity:1;pointer-events:auto}
body.open #sheet{transform:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 6px}
.sh b{font-size:19px;font-weight:600}
.sh button{border:0;background:none;color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:8px 4px;cursor:pointer}
#sbody{flex:1;overflow-y:auto;padding:4px 22px 20px}
.lists{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.name{width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:17px;padding:10px 2px;outline:none;border-radius:0}
.name:focus{border-color:var(--ink)}
.item{display:flex;align-items:center;gap:8px;padding:2px 0;box-shadow:0 1px 0 var(--line)}
.item input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:18px;padding:14px 2px;outline:none;min-width:0}
.x{border:0;background:none;color:var(--mute);width:44px;height:44px;font-size:22px;cursor:pointer;border-radius:12px;transition:color .2s,background .2s}
.x:active{color:#d4483b;background:var(--line)}
.add{display:flex;gap:10px;margin:14px 0 22px}
.add input{flex:1;border:1.5px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:18px;padding:13px 14px;border-radius:14px;outline:none}
.add input:focus{border-color:var(--ink)}
.add button{border:0;border-radius:14px;background:var(--btn);color:var(--btnink);font:inherit;font-size:16px;font-weight:600;padding:0 20px;cursor:pointer}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.danger{color:#d4483b;border-color:transparent}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1 id="title">יוצאים</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button id="edit" aria-label="עריכה">עריכה</button>
  </header>
  <div id="tabs"></div>
  <main id="list"></main>
  <footer><button class="reset" id="reset">נקה סימונים ליציאה חדשה</button></footer>
</div>
<div id="scrim"></div>
<div id="sheet" role="dialog" aria-label="עריכה">
  <div class="sh"><b>עריכה</b><button id="done">סיום</button></div>
  <div id="sbody"></div>
</div>
<script>
(function(){
  var KEY="leave-home-v2", S, saveOk=true;
  var $=function(i){return document.getElementById(i)};
  function uid(){return Math.random().toString(36).slice(2,9)}
  function load(){
    try{var r=localStorage.getItem(KEY); if(r){var o=JSON.parse(r); if(o&&o.lists&&o.lists.length) return o}}catch(e){}
    var id=uid(), names=["מגבונים","חיתולים","בקבוקים","מים למטרנה","מטרנה","קרקרים","מוצצים","מוצקים","טטרה","בגד החלפה קצר","בגד החלפה ארוך","צעצועים","מפתח לבית"];
    return {lists:[{id:id,name:"תיק אלישע",items:names.map(function(t){return {id:uid(),t:t,d:false}})}],active:id};
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  S=load();
  function cur(){return S.lists.filter(function(l){return l.id===S.active})[0]||S.lists[0]}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

  var CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var lastReady=null;

  function renderTabs(){
    var t=$("tabs");
    if(S.lists.length<2){t.style.display="none";t.innerHTML="";return}
    t.style.display="flex";
    t.innerHTML=S.lists.map(function(l){return '<button class="tab'+(l.id===cur().id?' on':'')+'" data-id="'+l.id+'">'+esc(l.name)+'</button>'}).join("");
  }
  function renderList(){
    var l=cur(), m=$("list");
    if(!l.items.length){
      m.innerHTML='<div class="empty">הרשימה ריקה.<br>הוסיפו את מה שצריך לקחת איתכם.<br><button class="ghost" id="emptyAdd">הוספת פריטים</button></div>';
      $("emptyAdd").onclick=openSheet;
    }else{
      m.innerHTML=l.items.map(function(it){
        return '<button class="row'+(it.d?' done':'')+'" data-id="'+it.id+'"><span class="box">'+CHECK+'</span><span class="label">'+esc(it.t)+'</span></button>';
      }).join("");
    }
    updateHead(true);
  }
  function updateHead(instant){
    var l=cur(), n=l.items.length, d=l.items.filter(function(i){return i.d}).length;
    var ready=n>0&&d===n;
    var h=$("title");
    var want=ready?"מוכנים ליציאה":"יוצאים";
    if(h.textContent!==want){
      if(instant){h.textContent=want;h.classList.toggle("ready",ready)}
      else{h.style.opacity=0;setTimeout(function(){h.textContent=want;h.classList.toggle("ready",ready);h.style.opacity=1},200)}
    }
    $("sub").textContent=n?(ready?"הכול מסומן":("נשארו "+(n-d)+" מתוך "+n)):"";
    $("reset").disabled=d===0;
  }
  function toggle(id){
    var l=cur(), it=l.items.filter(function(i){return i.id===id})[0]; if(!it) return;
    it.d=!it.d; save();
    var el=$("list").querySelector('[data-id="'+id+'"]'); if(el) el.classList.toggle("done",it.d);
    updateHead(false);
    checkComplete();
  }
  var HOLD=3000, timer=null;
  function allDone(l){return l.items.length>0&&l.items.every(function(i){return i.d})}
  function checkComplete(){
    var l=cur(); clearTimeout(timer);
    if(allDone(l)){
      if(!l.doneAt){l.doneAt=Date.now();save()}
      var wait=Math.max(0,HOLD-(Date.now()-l.doneAt));
      timer=setTimeout(function(){if(allDone(cur()))resetCurrent()},wait);
    }else if(l.doneAt){l.doneAt=0;save()}
  }
  function sweep(){
    var ch=false,now=Date.now();
    S.lists.forEach(function(l){
      if(!l.doneAt) return;
      if(allDone(l)&&now-l.doneAt>=HOLD){l.items.forEach(function(i){i.d=false});l.doneAt=0;ch=true}
      else if(!allDone(l)){l.doneAt=0;ch=true}
    });
    if(ch)save();
    return ch;
  }
  function resetCurrent(){
    var l=cur(); clearTimeout(timer); l.doneAt=0;
    l.items.forEach(function(i){i.d=false}); save();
    var rows=$("list").querySelectorAll(".row.done");
    for(var i=0;i<rows.length;i++){(function(r,k){setTimeout(function(){r.classList.remove("done")},k*45)})(rows[i],i)}
    setTimeout(function(){updateHead(false)},60);
  }
  $("list").addEventListener("click",function(e){
    var r=e.target.closest(".row"); if(r) toggle(r.getAttribute("data-id"));
  });
  $("tabs").addEventListener("click",function(e){
    var b=e.target.closest(".tab"); if(!b) return;
    S.active=b.getAttribute("data-id"); save(); renderTabs(); renderList();
  });
  $("reset").onclick=function(){resetCurrent()};

  /* edit sheet */
  function openSheet(){renderSheet();document.body.classList.add("open")}
  function closeSheet(){document.activeElement&&document.activeElement.blur();document.body.classList.remove("open");renderTabs();renderList()}
  $("edit").onclick=openSheet;
  $("done").onclick=closeSheet;
  $("scrim").onclick=closeSheet;

  function renderSheet(focusAdd){
    var l=cur(), b=$("sbody");
    var lists=S.lists.map(function(x){return '<button class="tab'+(x.id===l.id?' on':'')+'" data-sw="'+x.id+'">'+esc(x.name)+'</button>'}).join("");
    if(S.lists.length<3) lists+='<button class="tab" id="newList">+ רשימה</button>';
    b.innerHTML=
      '<div class="lists">'+lists+'</div>'+
      '<input class="name" id="lname" value="'+esc(l.name)+'" aria-label="שם הרשימה" maxlength="24">'+
      '<div class="add"><input id="newItem" placeholder="פריט חדש" enterkeyhint="done" maxlength="60"><button id="addBtn">הוספה</button></div>'+
      l.items.map(function(it){return '<div class="item" data-id="'+it.id+'"><input value="'+esc(it.t)+'" maxlength="60"><button class="x" aria-label="מחיקה">×</button></div>'}).join("")+
      '<div class="tools" style="margin-top:24px">'+(S.lists.length>1?'<button class="ghost danger" id="delList">מחיקת הרשימה</button>':'')+'</div>';
    if(focusAdd) $("newItem").focus();
  }
  function addItem(){
    var inp=$("newItem"), v=inp.value.trim(); if(!v) return;
    cur().items.push({id:uid(),t:v,d:false}); save(); renderSheet(true);
  }
  $("sbody").addEventListener("click",function(e){
    var t=e.target, l=cur();
    if(t.id==="addBtn") return addItem();
    var sw=t.getAttribute&&t.getAttribute("data-sw");
    if(sw){S.active=sw;save();return renderSheet()}
    if(t.id==="newList"){var id=uid();S.lists.push({id:id,name:"רשימה "+S.lists.length,items:[]});S.active=id;save();renderSheet();var n=$("lname");n.focus();n.select();return}
    if(t.id==="delList"){
      if(t.getAttribute("data-sure")!=="1"){t.setAttribute("data-sure","1");t.textContent="לחצו שוב למחיקה";return}
      S.lists=S.lists.filter(function(x){return x.id!==l.id});S.active=S.lists[0].id;save();return renderSheet();
    }
    if(t.classList.contains("x")){
      var row=t.closest(".item"), id2=row.getAttribute("data-id");
      l.items=l.items.filter(function(i){return i.id!==id2});save();row.remove();
    }
  });
  $("sbody").addEventListener("input",function(e){
    var t=e.target, l=cur();
    if(t.id==="lname"){l.name=t.value.trim()||"רשימה";save();return}
    var row=t.closest&&t.closest(".item");
    if(row){var it=l.items.filter(function(i){return i.id===row.getAttribute("data-id")})[0]; if(it){it.t=t.value;save()}}
  });
  $("sbody").addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="newItem"){e.preventDefault();addItem()}});

  /* home-screen icon */
  try{
    var c=document.createElement("canvas");c.width=c.height=180;var x=c.getContext("2d");
    x.fillStyle="#111214";x.fillRect(0,0,180,180);
    x.strokeStyle="#4cc283";x.lineWidth=14;x.lineCap="round";x.lineJoin="round";
    x.beginPath();x.moveTo(52,92);x.lineTo(80,120);x.lineTo(130,62);x.stroke();
    $("touch").href=c.toDataURL("image/png");
  }catch(e){}
  if(/^https?:$/.test(location.protocol)){
    $("touch").href="icon-180.png";
    if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});
  }

  sweep();renderTabs();renderList();checkComplete();
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState!=="visible") return;
    if(sweep()){renderTabs();renderList()}
    checkComplete();
  });
})();
</script>
</body>
</html>
